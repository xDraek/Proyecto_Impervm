<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imperium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div id="scene"></div>
      <header id="topbar">
        <div class="brand">⚜ Imperium</div>
        <div id="resources"></div>
        <div class="top-actions">
          <button id="favor" class="pill" title="Favor de los dioses" hidden></button>
          <button id="view-btn" class="tab-btn" title="Cambiar entre tu isla y el archipiélago (M)">🗺️ <span>Mapa</span></button>
          <button id="quests-btn" class="icon-btn" title="Misiones">📋<span class="badge" hidden></span></button>
          <button id="rank-btn" class="icon-btn" title="Clasificación">🏆</button>
          <button id="reports-btn" class="icon-btn" title="Informes">📜<span class="badge" hidden></span></button>
          <button id="menu-btn" class="icon-btn" title="Opciones">⚙</button>
        </div>
      </header>
      <div id="menu" class="menu" hidden>
        <label><input type="checkbox" name="sound" /> 🔊 Sonido</label>
        <label><input type="checkbox" name="daynight" /> 🌗 Día y noche</label>
        <button class="ghost small" data-action="reset">Reiniciar partida…</button>
      </div>
      <div id="banners">
        <button id="alert" hidden></button>
        <div id="visitor" hidden></div>
      </div>
      <aside id="sidebar"></aside>
      <section id="panel" hidden></section>
      <div id="dock" hidden></div>
      <div id="modal" hidden></div>
      <div id="toasts"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
